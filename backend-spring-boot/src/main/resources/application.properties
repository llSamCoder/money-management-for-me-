# ============================================================================
# SAMEER'S MONEY MANAGER - Personal Finance Control Center
# Spring Boot Configuration
# ============================================================================
server.port=8080
spring.application.name=SAMEER'S MONEY MANAGER

# MySQL Database Connectivity
spring.datasource.url=jdbc:mysql://localhost:3306/sameer_money_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata

# Branding properties
app.branding.name=SAMEER'S MONEY MANAGER
app.branding.subtitle=Personal Finance Control Center
app.branding.tagline=Your Money. Your Control. Your Future.
app.branding.owner=SAMEER
